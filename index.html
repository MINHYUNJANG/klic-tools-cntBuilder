<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>KLIC TOOLs - 콘텐츠 빌더</title>
	<link rel="stylesheet" href="/css/fonts/Montserrat/fonts.css" media="all">
	<link rel="stylesheet" href="/css/fonts/Pretendard/fonts.css" media="all">
	<link rel="stylesheet" href="/css/fonts/RemixIcon_Fonts_v4.7.0/remixicon.css" media="all">
	<link rel="stylesheet" href="/css/basic.css" media="all">
	<link rel="stylesheet" href="/css/common.css" media="all">
	<link rel="stylesheet" href="/css/theme.css" media="all">
	<link rel="stylesheet" href="/css/con_com.css" media="all">
	<link rel="stylesheet" href="/css/canvas.css" media="all">
	<link rel="stylesheet" href="/css/cntBuilder_common.css" media="all">
</head>
<body class="cntBuilder-page">
	<div class="app-shell">
		<div id="headerSentinel" class="header-sentinel"></div>
		<header class="topbar">
			<div class="topbar-brand">
				<span class="topbar-logo" aria-hidden="true"></span>
				<a class="topbar-title-link" href="./" aria-label="콘텐츠 빌더 홈">
					<p class="eyebrow">Grid Builder</p>
					<div class="title-row">
						<strong>KLIC TOOLs</strong>
						<span aria-hidden="true"></span>
						<h1>콘텐츠 빌더</h1>
					</div>
				</a>
			</div>
			<div class="topbar-extra" id="topbarExtra"></div>
			<div class="topbar-actions">
				<span id="layoutStatus">0개 블록</span>
				<span class="topbar-action-divider" aria-hidden="true"></span>
				<div class="device-switcher" id="deviceSwitcher" aria-label="반응형 미리보기">
					<button type="button" class="device-btn is-active" data-device="pc" title="PC (1024px 이상)">
						<i class="ri-computer-line" aria-hidden="true"></i>
					</button>
					<button type="button" class="device-btn" data-device="tablet" title="태블릿 (768–1023px)">
						<i class="ri-tablet-line" aria-hidden="true"></i>
					</button>
					<button type="button" class="device-btn" data-device="mobile" title="모바일 (380–767px)">
						<i class="ri-cellphone-line" aria-hidden="true"></i>
					</button>
				</div>
				<span class="topbar-action-divider" aria-hidden="true"></span>
				<div class="canvas-size-control" id="canvasSizeControl" aria-label="캔버스 크기설정"></div>
				<button type="button" class="ghost-button" id="clearCanvas">
					<i class="ri-refresh-line" aria-hidden="true"></i>
					캔버스 초기화
				</button>
				<button type="button" class="ghost-button markup-toggle" id="markupToggle" aria-expanded="false" aria-controls="markupPanel">
					<i class="ri-code-s-slash-line" aria-hidden="true"></i>
					마크업 보기
				</button>
				<button type="button" class="preview-button" id="previewToggle">
					<i class="ri-eye-line" aria-hidden="true"></i>
					미리보기
				</button>
			</div>
			<div class="topbar-preview-actions">
				<button type="button" class="primary-button" id="savePreviewImage">
					<i class="ri-image-line" aria-hidden="true"></i>
					이미지 저장
				</button>
				<button type="button" class="ghost-button" id="previewMarkupOpen">
					<i class="ri-code-s-slash-line" aria-hidden="true"></i>
					마크업 보기
				</button>
			</div>
			<button type="button" class="preview-return-button" id="previewReturn">
				<i class="ri-arrow-left-line" aria-hidden="true"></i>
				캔버스로 돌아가기
			</button>
		</header>

		<main class="builder" id="builderMain">
			<aside class="sidebar" aria-label="디자인 블록 도구">
				<aside class="deco-studio-drawer" id="decoStudioDrawer" aria-label="꾸밈 스튜디오" hidden>
					<div class="deco-studio-head">
						<strong>꾸밈 스튜디오</strong>
						<button type="button" class="ghost-button deco-studio-close" id="decoStudioClose" aria-label="꾸밈 스튜디오 닫기">
							<i class="ri-close-line" aria-hidden="true"></i>
						</button>
					</div>
					<div class="sidebar-tab-panel" id="panelDecoration">
						<div class="filter-scroll-shell">
							<div class="deco-filters" id="decoFilters"></div>
						</div>
						<div class="component-list" id="decorationPanel"></div>
						<div class="deco-upload-area" id="decoUploadArea"></div>
					</div>
				</aside>
				<section class="tool-section">
					<!-- 메인 탭 -->
					<div class="sidebar-tabs">
						<button type="button" class="sidebar-tab-btn" data-sidebar-tab="custom">디자인 커스텀</button>
						<button type="button" class="sidebar-tab-btn is-active" data-sidebar-tab="blocks">디자인 블록</button>
					</div>

					<!-- 디자인 블록 패널 -->

					<div class="sidebar-tab-panel is-hidden sidebar-ready-panel" id="panelCustom">
						<p class="template-empty">준비중입니다.</p>
					</div>

					<div class="sidebar-tab-panel" id="panelBlocks">
						<div class="filter-scroll-shell">
							<div class="component-filters" aria-label="디자인 블록 필터">
								<button type="button" class="is-active" data-template-filter="all">전체</button>
								<button type="button" data-template-filter="title">타이틀</button>
								<button type="button" data-template-filter="text">텍스트</button>
								<button type="button" data-template-filter="list">리스트</button>
								<button type="button" data-template-filter="box">박스</button>
								<button type="button" data-template-filter="tab">탭</button>
								<button type="button" data-template-filter="process">절차</button>
								<button type="button" data-template-filter="button">버튼</button>
								<button type="button" data-template-filter="bullet">불릿</button>
							</div>
						</div>
						<div class="component-list" id="componentList" aria-label="드래그 가능한 디자인 블록">
							<p class="template-loading">
								<span class="template-loading-spinner" aria-hidden="true"></span>
								템플릿을 불러오는 중입니다.
							</p>
						</div>
					</div>

				</section>
			</aside>

			<section class="workspace" aria-label="서브콘텐츠 작업 영역">
				<div class="canvas-quick-actions" aria-label="캔버스 보조 도구">
					<button type="button" class="canvas-tool-fab deco-fab" id="decoStudioOpen" aria-label="꾸밈 스튜디오 열기" hidden>
						<i class="ri-sparkling-2-line" aria-hidden="true"></i>
					</button>
					<button type="button" class="canvas-tool-fab recommend-fab" id="recommendPanelOpen" aria-label="추천디자인 열기" hidden>
						<i class="ri-magic-line" aria-hidden="true"></i>
					</button>
				</div>
				<div class="canvas-wrapper" id="canvasWrapper">
					<div class="canvas-guide" aria-hidden="true"></div>
					<div class="canvas-grid" id="canvasGrid" aria-label="디자인 블록 배열 영역"></div>
					<div class="overlay-layer" id="overlayLayer" aria-hidden="true"></div>
				</div>
			</section>


		</main>

	</div>

	<aside class="block-props-panel" id="blockPropsPanel" aria-label="블록 속성">
		<div class="block-props-head">
			<strong class="block-props-name" id="blockPropsTitle">블록</strong>
			<button type="button" class="block-props-close-btn" id="blockPropsClose" aria-label="닫기">
				<i class="ri-close-line" aria-hidden="true"></i>
			</button>
		</div>
		<div class="block-props-body">
			<div class="props-section">
				<p class="props-section-label">블록 설정</p>
				<div class="props-card">
					<div class="props-row props-row--last">
						<span class="props-label">정렬</span>
						<div class="props-align-btns" id="propBlockAlign">
							<button type="button" class="props-align-btn" data-align="al" title="왼쪽 정렬" aria-label="왼쪽 정렬">
								<i class="ri-align-left" aria-hidden="true"></i>
							</button>
							<button type="button" class="props-align-btn" data-align="ac" title="중앙 정렬" aria-label="중앙 정렬">
								<i class="ri-align-center" aria-hidden="true"></i>
							</button>
							<button type="button" class="props-align-btn" data-align="ar" title="오른쪽 정렬" aria-label="오른쪽 정렬">
								<i class="ri-align-right" aria-hidden="true"></i>
							</button>
						</div>
					</div>
				</div>
			</div>
			<div class="props-section" id="propsListSection" style="display:none">
				<p class="props-section-label">행 관리</p>
				<div class="props-card props-list-card" id="propsListRowsContainer"></div>
				<button type="button" class="props-add-row-btn" id="propsAddRowTop">
					<i class="ri-add-line" aria-hidden="true"></i> 행 추가
				</button>
			</div>
			<div class="props-section" id="propsLinkSection" style="display:none">
				<p class="props-section-label">링크 설정</p>
				<div class="props-card">
					<div class="props-row">
						<span class="props-label">URL</span>
						<input type="url" class="props-input props-input--wide" id="propLinkHref" placeholder="https://...">
					</div>
					<div class="props-row props-row--last">
						<span class="props-label">이동 타입</span>
						<select class="props-select" id="propLinkTarget">
							<option value="_blank">새 창 (_blank)</option>
							<option value="_self">현재 창 (_self)</option>
							<option value="_parent">부모 창 (_parent)</option>
							<option value="_top">최상위 창 (_top)</option>
						</select>
					</div>
				</div>
			</div>
			<div class="props-section" id="propsDownloadSection" style="display:none">
				<p class="props-section-label">다운로드 설정</p>
				<div class="props-card">
					<div class="props-row props-row--last">
						<span class="props-label">파일 선택</span>
						<input type="file" class="props-file-input" id="propDownloadFile">
					</div>
				</div>
				<button type="button" class="props-add-row-btn" id="propsApplyDownload">
					<i class="ri-check-line" aria-hidden="true"></i> 적용
				</button>
				<p class="props-notice" id="propsDownloadNotice" style="display:none">추후 작업예정입니다.</p>
			</div>
		</div>
	</aside>

	<!-- 인라인 스마트 블록 속성 팝업 -->
	<div class="inline-prop-popup" id="inlinePropPopup" role="dialog" aria-label="인라인 요소 속성 설정">
		<div class="inline-prop-popup__row">
			<span class="inline-prop-popup__label">텍스트</span>
			<input type="text" class="inline-prop-popup__input" id="inlinePropText" placeholder="표시할 텍스트">
		</div>
		<div class="inline-prop-popup__link" id="inlinePropLinkSection">
			<div class="inline-prop-popup__row">
				<span class="inline-prop-popup__label">URL</span>
				<input type="url" class="inline-prop-popup__input" id="inlinePropHref" placeholder="https://">
			</div>
			<div class="inline-prop-popup__row" id="inlinePropTargetRow">
				<span class="inline-prop-popup__label">이동 타입</span>
				<select class="inline-prop-popup__select" id="inlinePropTarget">
					<option value="_blank">새 창 (_blank)</option>
					<option value="_self">현재 창 (_self)</option>
					<option value="_parent">부모 창 (_parent)</option>
					<option value="_top">최상위 창 (_top)</option>
				</select>
			</div>
		</div>
		<div class="inline-prop-popup__download" id="inlinePropDownloadSection" style="display:none">
			<p class="inline-prop-popup__notice">추후 작업예정입니다.</p>
		</div>
		<div class="inline-prop-popup__actions">
			<button type="button" class="inline-prop-popup__cancel" id="inlinePropCancel">취소</button>
			<button type="button" class="inline-prop-popup__confirm" id="inlinePropConfirm">삽입</button>
		</div>
	</div>

	<aside class="markup-panel" id="markupPanel" role="dialog" aria-modal="true" aria-label="생성된 마크업">
		<div class="markup-backdrop" id="markupBackdrop"></div>
		<div class="markup-panel-inner">
			<div class="markup-head">
				<div>
					<h2>마크업</h2>
				</div>
				<div class="markup-head-actions">
					<button type="button" class="primary-button copy-markup-button" id="copyMarkup">
						<i class="ri-file-copy-line" aria-hidden="true"></i>
						복사
					</button>
					<button type="button" class="ghost-button markup-close-btn" id="markupClose" aria-label="닫기">
						<i class="ri-close-line" aria-hidden="true"></i>
					</button>
				</div>
			</div>
			<textarea id="markupOutput" spellcheck="false" aria-label="생성된 HTML 마크업"></textarea>
			<p class="copy-state" id="copyState" aria-live="polite"></p>
		</div>
	</aside>

	<div class="icon-drawer" id="iconDrawer">
		<div class="icon-drawer-backdrop" id="iconDrawerBackdrop"></div>
		<div class="icon-drawer-panel">
			<div class="icon-drawer-head">
				<strong>아이콘 선택</strong>
				<button type="button" class="ghost-button" id="iconDrawerClose">
					<i class="ri-close-line" aria-hidden="true"></i>
				</button>
			</div>
			<div class="icon-drawer-body">
				<nav class="icon-tree" id="iconTree"></nav>
				<div class="icon-grid-area" id="iconGridArea">
					<p class="icon-grid-empty">왼쪽에서 카테고리를 선택하세요.</p>
				</div>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>
	<script src="/js/builder-shared.js"></script>
	<script src="/js/cntBuilder.js"></script>
</body>
</html>
